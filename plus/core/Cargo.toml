[package]
name = "toolport-plus"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fork logic that runs on top of upstream Toolport through toolport-plus-api"

[dependencies]
toolport-plus-api = { path = "../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
sha2 = "0.10"
serde_yaml = "0.9"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
